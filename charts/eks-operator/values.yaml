global:
  cattle:
    systemDefaultRegistry: ""
    # imagePullSecrets:
    #   - name: secret1
    imagePullSecrets: []

eksOperator:
  image:
    repository: rancher/eks-operator
    tag: v0.0.0

httpProxy: ""
httpsProxy: ""
noProxy: ""
additionalTrustedCAs: false
## Overrides the AWS dual-stack endpoints used by the operator, accepts true or false.
## By default the operator uses dual-stack endpoints only in the AWS partitions publishing
## them for every service it calls, which excludes the AWS China and GovCloud partitions.
useDualStackEndpoint: null
## Node labels for pod assignment
## Ref: https://kubernetes.io/docs/user-guide/node-selection/
##
nodeSelector: {}
## List of node taints to tolerate (requires Kubernetes >= 1.6)
tolerations: []

## PriorityClassName assigned to deployment.
priorityClassName: ""
